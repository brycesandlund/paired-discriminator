[project]
name = "paired-discriminator"
version = "0.1.0"
description = "Controlled experiments with joint paired discriminators"
requires-python = ">=3.12,<3.13"
dependencies = ["torch>=2.6", "numpy>=2.0", "matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
paired-discriminator = "paired_discriminator.experiment:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
